train_file: data/processed/cpo/train.jsonl
model_name_or_path: Qwen/Qwen2.5-1.5B-Instruct
output_dir: outputs/checkpoints/cpo
max_seq_length: 512
per_device_train_batch_size: 4
gradient_accumulation_steps: 2
learning_rate: 1.0e-5
max_grad_norm: 0.3
warmup_ratio: 0.0
warmup_steps: 10
num_train_epochs: 1.0
logging_steps: 10
save_steps: 500
save_total_limit: 1
seed: 42
beta: 0.01
alpha: 0.3
lambda_desirable: 1.0
lambda_undesirable: 1.0
kl_coef: 0.0
z_baseline: token_kl
z_momentum: 0.9
pair_aware_batching: true
cluster_sampling: proportional
use_lora: true
